<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1356" role="img" aria-labelledby="title desc"><title id="title">Lucid toolkit architecture</title><desc id="desc">Company Toolkit and Guidelines connect four toolkits: Product Toolkit with Air, Gravity, Earth, and future products; System UI with Status Bar, Notification, Drawer, and Menu; App Toolkit with Media, Phone, Navigation, and Mobile; and Dev Toolkit with Android, QNX, and iOS mobile.</desc><style>text { font-family: Helvetica Neue, Helvetica, Arial, sans-serif; } .label {fill:#d5b58d;font-size:13px;letter-spacing:2px;} .heading {fill:#f5f3ef;font-weight:500;font-size:25px;letter-spacing:-.5px;} .item {fill:#c9c8c5;font-size:23px;} .connector {fill:none;stroke:#8f785c;stroke-width:1.4;} .panel {fill:#0d0d0c;stroke:#34332f;stroke-width:1;} .dot {fill:#d5b58d;}</style>
<rect width="560" height="1356" fill="#000"/>
